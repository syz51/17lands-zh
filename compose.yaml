services:
  card-cache:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CARGO_MIRROR: ${CARGO_MIRROR:-}
    restart: unless-stopped
    environment:
      CARD_CACHE_LISTEN: 0.0.0.0:17317
      CARD_CACHE_ALLOWED_HOSTS: ${CARD_CACHE_ALLOWED_HOSTS:?Set the API hostname in Dokploy Environment}
    expose:
      - "17317"
    volumes:
      - card-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  card-data:
