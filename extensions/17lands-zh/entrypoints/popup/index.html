<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>17Lands 中文卡图</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main>
      <header><span class="mark" aria-hidden="true">中</span><h1>17Lands 中文卡图</h1></header>
      <p>在卡包、已选牌与悬浮预览中阅读中文卡图。</p>
      <label class="setting"><span>显示中文卡图</span><input id="enabled" type="checkbox" role="switch" disabled /></label>
      <p class="hint">缺图时保留英文图；有中文文字时可打开“中文阅读”。</p>
      <p id="service" role="status" aria-live="polite">正在连接本地卡牌服务…</p>
      <button id="retry" type="button" disabled>重试加载中文图</button>
      <p id="status" role="status" aria-live="polite">正在读取设置…</p>
      <footer>中文图源：<a href="https://www.mtgch.com/" target="_blank" rel="noreferrer">大学院废墟 ↗</a></footer>
    </main>
  </body>
</html>
