name: Chrome Web Store

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag, for example v0.5.0
        required: true
        type: string
      dry_run:
        description: Validate the release and read store status without uploading or submitting
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    if: >-
      github.repository == 'syz51/17lands-zh' &&
      ((github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    # The OIDC provider trusts only this reusable workflow from protected main.
    uses: syz51/17lands-zh/.github/workflows/publish-chrome-web-store.yml@main
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
