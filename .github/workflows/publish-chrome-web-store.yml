name: Publish Chrome Web Store

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      dry_run:
        default: true
        required: false
        type: boolean

permissions:
  contents: read
  actions: read

# A single publisher owns uploads. Keep pending releases instead of replacing them.
concurrency:
  group: chrome-web-store
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: github.repository == 'syz51/17lands-zh'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: chrome-web-store
    permissions:
      contents: read
      actions: read
      id-token: write
    defaults:
      run:
        working-directory: extensions/17lands-zh
    steps:
      # Historical tags can be replayed; only trusted main supplies deployment code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Verify release, exact-commit CI and remote package
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bun scripts/prepare-store-release.ts
      - name: Check out the exact verified source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.sha }}
          path: release-source
          persist-credentials: false
      - name: Rebuild the checked release without store credentials
        working-directory: release-source/extensions/17lands-zh
        run: |
          bun install --frozen-lockfile
          bun run zip:store
      - name: Require released runtime bytes to match the source build
        id: source
        env:
          CWS_VERSION: ${{ steps.release.outputs.version }}
          CWS_RELEASE_ZIP: ${{ steps.release.outputs.zip_path }}
          CWS_REBUILT_ZIP: ${{ github.workspace }}/release-source/extensions/17lands-zh/.output/17lands-zh-${{ steps.release.outputs.version }}-chrome.zip
        run: bun scripts/prepare-store-release.ts compare
      - name: Check store connection configuration
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
        run: |
          : "${CWS_PUBLISHER_ID:?Set CWS_PUBLISHER_ID in the chrome-web-store environment}"
          : "${CWS_EXTENSION_ID:?Set CWS_EXTENSION_ID in the chrome-web-store environment}"
          : "${CWS_WORKLOAD_IDENTITY_PROVIDER:?Set CWS_WORKLOAD_IDENTITY_PROVIDER in the chrome-web-store environment}"
          : "${CWS_SERVICE_ACCOUNT:?Set CWS_SERVICE_ACCOUNT in the chrome-web-store environment}"
      - name: Obtain a short-lived Chrome Web Store token
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false
      - name: Upload and submit, or validate without mutation
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_VERSION: ${{ steps.release.outputs.version }}
          CWS_ZIP_PATH: ${{ steps.source.outputs.zip_path }}
          CWS_DRY_RUN: ${{ inputs.dry_run }}
        run: bun scripts/publish-store.ts
